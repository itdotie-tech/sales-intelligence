<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT.ie Revenue Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101e3b;--navy2:#0b1630;--panel:#182a52;--panel2:#1d3160;--blue:#00a0d8;--yellow:#f9c20d;--ink:#fff;--mut:#8ea0c0;--mut2:#5f6f92;--line:rgba(255,255,255,.09);--good:#2fbf71;--bad:#e5484d;--orange:#f28c3b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy2);color:var(--ink);font:15px/1.55 Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Archivo Black','Arial Black',Arial,sans-serif;font-weight:400;letter-spacing:.2px}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}
.side{width:224px;flex-shrink:0;background:var(--navy);border-right:1px solid var(--line);padding:22px 14px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo{font-family:'Archivo Black',Arial,sans-serif;font-size:22px;color:#fff}.logo b{color:var(--blue)}
.logo-sub{font-size:10.5px;color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:16px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mut);font:500 13px Roboto,Arial,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;transition:.2s}
.nav button svg{width:16px;height:16px;flex-shrink:0}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(0,160,216,.16);color:#fff}.nav button.on svg{color:var(--blue)}
.nav button.sub{padding-left:34px;font-size:12.5px}
.nav button.locked{opacity:.4;cursor:not-allowed}
.nav .sep{margin:9px 10px 4px;font-size:10px;letter-spacing:1.4px;color:var(--mut2);text-transform:uppercase}
.side-foot{font-size:11px;color:var(--mut2);padding:10px 6px 0;border-top:1px solid var(--line)}
.side-foot button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;width:100%;margin-bottom:8px}
.side-foot button:hover{color:#fff;border-color:var(--blue)}
.side-foot button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.main{flex:1;min-width:0;padding:16px 26px 60px}
.fbar{position:sticky;top:0;z-index:30;background:linear-gradient(var(--navy2) 86%,transparent);padding:6px 0 12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fbar select,.fbar input{background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px}
.fbar .chip{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.fbar .chip:hover{color:#fff;border-color:var(--blue)}
.fbar .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fbar .vr{width:1px;height:22px;background:var(--line);margin:0 3px}
.fbar .lbl{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}
.fdrop{position:relative}.fdrop input{width:190px}
.fdrop .dd{display:none;position:absolute;top:38px;left:0;width:320px;max-height:320px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.fdrop .dd div{padding:7px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.fdrop .dd div:hover{background:rgba(0,160,216,.15);color:#fff}
.selchips{display:flex;gap:6px;flex-wrap:wrap}
.selchips span{background:rgba(0,160,216,.18);border:1px solid rgba(0,160,216,.4);color:#cfeefc;font-size:12px;border-radius:999px;padding:4px 10px;cursor:pointer}
.selchips span:hover{background:var(--bad)}
.page{display:none;animation:fade .25s ease}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{margin:6px 0 4px;font-size:24px}.ph em{color:var(--blue);font-style:normal}
.psub{color:var(--mut);font-size:13.5px;margin-bottom:16px;max-width:940px}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(166px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden}
.card .k{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.card .v{font-family:'Archivo Black',Arial,sans-serif;font-size:23px;line-height:1.15}
.card .s{font-size:12px;color:var(--mut);margin-top:5px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--yellow)}
.card.hl{border-color:rgba(249,194,13,.5)}.card.hl .v{color:var(--yellow)}
.cmp{font-size:11px;padding:2px 7px;border-radius:6px;margin-left:6px;background:rgba(255,255,255,.06)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.panel h3{font-size:14.5px;margin-bottom:3px}.panel .hint{font-size:12px;color:var(--mut);margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.two{grid-template-columns:1fr}.side{width:66px}.side .logo-sub,.side .nav button span,.side-foot span,.side .sep{display:none}}
.chartbox{position:relative;height:300px}.chartbox.tall{height:360px}.chartbox.short{height:220px}
.twrap{overflow:auto;max-height:520px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);color:var(--mut);text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;padding:9px 10px;white-space:nowrap;z-index:2}
th.num,td.num{text-align:right}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
tr:hover td{background:rgba(0,160,216,.06)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.y{background:var(--good)}.dot.n{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}.dot.o{background:var(--yellow)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;margin:1px 3px 1px 0;background:rgba(0,160,216,.15);border:1px solid rgba(0,160,216,.35);color:#bfe9fa}
.tag.gap{background:rgba(249,194,13,.12);border-color:rgba(249,194,13,.45);color:var(--yellow)}
.tag.g{background:rgba(47,191,113,.14);border-color:rgba(47,191,113,.4);color:#9be9c0}
.tag.r{background:rgba(229,72,77,.14);border-color:rgba(229,72,77,.4);color:#f3a3a5}
.clink{cursor:pointer;color:#dbe7ff}.clink:hover{color:var(--blue);text-decoration:underline}
.radar-item{border:1px solid var(--line);border-left:4px solid var(--yellow);background:var(--panel);border-radius:12px;padding:14px 16px;margin-top:10px}
.radar-item h4{font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.radar-item h4 .eur{font-family:'Archivo Black',Arial,sans-serif;color:var(--yellow);white-space:nowrap}
.radar-item .acts{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.radar-item .acts div{font-size:13px;color:#c8d4ea;padding-left:16px;position:relative}
.radar-item .acts div::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.radar-item .acts div b{color:#fff}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:8px;box-shadow:0 0 0 0 rgba(249,194,13,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 11px rgba(249,194,13,0)}100%{box-shadow:0 0 0 0 rgba(249,194,13,0)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.page{animation:none}}
.btn{background:var(--blue);border:0;color:#fff;font:500 13px Roboto,Arial,sans-serif;border-radius:8px;padding:8px 15px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.sec{background:var(--yellow);color:var(--navy)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}.btn.ghost:hover{color:#fff;border-color:var(--blue)}
.btn.sm{padding:5px 11px;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(5,10,25,.75);z-index:90;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:24px}
.modal h2{font-size:18px;margin-bottom:6px}
.modal label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--navy2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:8px 10px;font-size:13px}
.modal textarea{min-height:90px;font-family:monospace}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.note{font-size:12px;color:var(--mut);background:rgba(0,160,216,.07);border:1px solid rgba(0,160,216,.25);border-radius:10px;padding:10px 13px;margin-top:12px}.note b{color:#cfeefc}
.legend-inline{font-size:12px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dropzone{border:2px dashed rgba(0,160,216,.4);border-radius:14px;padding:20px;text-align:center;color:var(--mut);transition:.2s;cursor:pointer;background:rgba(0,160,216,.03)}
.dropzone:hover,.dropzone.over{border-color:var(--yellow);color:#fff;background:rgba(249,194,13,.05)}
.dropzone b{color:#fff;display:block;font-size:14px;margin-bottom:3px}.dropzone .st{font-size:11.5px;margin-top:8px}.dropzone .st.ok{color:var(--good)}
.filegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.prog{position:fixed;inset:0;background:rgba(5,10,25,.9);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.prog.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(0,160,216,.2);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lockmsg{text-align:center;padding:60px 20px;color:var(--mut);max-width:640px;margin:0 auto}
.lockmsg h2{font-size:22px;color:#fff;margin-bottom:10px}
.lockmsg .big{font-size:44px;margin-bottom:14px}
.scorebar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;display:inline-block;width:96px;vertical-align:middle;margin-right:8px}
.scorebar i{display:block;height:100%;border-radius:5px}
.nis2row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.nis2row .id{width:26px;height:26px;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.nis2row .txt{flex:1;font-size:13.5px}.nis2row .txt small{color:var(--mut);display:block;font-size:11.5px}
.nis2row .stat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.stat.met{background:rgba(47,191,113,.16);color:#9be9c0}.stat.part{background:rgba(249,194,13,.14);color:var(--yellow)}.stat.gap{background:rgba(229,72,77,.16);color:#f3a3a5}.stat.pol{background:rgba(142,108,240,.16);color:#c3b2f7}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.pill.none{color:var(--mut2)}.pill.basic{color:#bfe9fa;border-color:rgba(0,160,216,.4)}.pill.pro{color:#9be9c0;border-color:rgba(47,191,113,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a3d6d;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
@media print{.side,.fbar,.side-foot{display:none!important}.main{padding:0}.page{display:block!important}}

.flabel{display:block;font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.finput{width:100%;background:var(--navy2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:8px 10px;font-size:13px}
.pkline{display:grid;grid-template-columns:22px 1fr 68px 78px 84px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.pkline.on{background:rgba(0,160,216,.06)}
.pkline input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue)}
.pkname{font-size:13px}.pkname small{display:block;color:var(--mut2);font-size:11px}
.pkqty,.pkprice{background:var(--navy2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:4px 6px;font-size:12px;width:100%}
.pkqty:disabled,.pkprice:disabled{opacity:.3}
.pkamt{text-align:right;font-size:12.5px;color:var(--yellow)}
.pbrow{display:grid;grid-template-columns:1fr 92px 96px 74px 66px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.pbrow input,.pbrow select{background:var(--navy2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:4px 6px;font-size:12px;width:100%}
.conf{font-size:10px;padding:2px 6px;border-radius:5px}
.conf.High{background:rgba(47,191,113,.16);color:#9be9c0}.conf.Medium{background:rgba(249,194,13,.14);color:var(--yellow)}.conf.Low{background:rgba(229,72,77,.16);color:#f3a3a5}
.stab{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.stab button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer}
.stab button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.modal.wide{width:min(940px,96vw)}

.srcbadge-wrap{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.srcbadge-wrap .sb{display:flex;align-items:center;gap:7px;font-size:11px;line-height:1.3}
.srcbadge-wrap .dotc{width:8px;height:8px;border-radius:50%;flex:none}
.srcbadge-wrap .on{background:#2fbf71}.srcbadge-wrap .off{background:#5f6f92}.srcbadge-wrap .warn{background:#f9c20d}
.srcbadge-wrap .sb b{color:#cdd8ee;font-weight:600}
.srcbadge-wrap .sb small{color:var(--mut2);display:block;font-size:10px}
</style>
</head>

<script>
/* ==================================================================
   IT.ie Revenue Intelligence — data pipeline v3
   Source: ITie_AI_Build_Dashboard_Service_Mapped_v2.xlsx (pre-mapped)
   Runs entirely in-browser. Master company level, branch drill-down.
================================================================== */
const PIPE = (() => {

  /* ---------- overrides applied on top of the workbook mapping ---------- */
  // The workbook tags "01 Managed IT : MIT - Remote" as MIT. It is remote.
  function isRemoteMIT(cls, tier){
    if(tier==='RMIT') return true;
    return /remote|rmit/i.test(cls||'');
  }
  // "CyberProtect Other" collapses six unrelated products. Split them.
  function splitCPOther(cls, item){
    const t=((cls||'')+' '+(item||'')).toLowerCase();
    if(/kaseya 365\s*:\s*soc|cyberprotect \(soc\)/.test(t)) return 'CP_SOC';
    if(/huntress/.test(t))            return 'STD_SOC';
    if(/\beset\b/.test(t))            return 'STD_AV';
    if(/ptaas|pen ?test/.test(t))     return 'PENTEST';
    if(/graphus/.test(t))             return 'EMAILSEC';
    if(/deployment|tasks -/.test(t))  return 'SERVICES';
    return 'CP_OTHER';
  }

  const SVC_ORDER=['MIT','RMIT','M365','Azure','CPEndpoint','CPUser','CP365Backup','SOC','EndpointSec','EmailSec','Awareness','PenTest','Firewall','Backup','MDM','VOIP','Connectivity','WebDomain','Hardware','ProjectServices','Other'];

  /* Decide the reporting service line for a fact row. */
  function svcOf(r){
    const fam=r.fam, tier=r.tier||'', cls=r.cls||'', item=r.item||'';
    if(fam==='Managed IT')  return isRemoteMIT(cls,tier) ? 'RMIT' : 'MIT';
    if(fam==='Microsoft 365 / NCE') return tier==='Azure' ? 'Azure' : 'M365';
    if(fam==='CyberProtect / Kaseya 365'){
      if(tier==='Endpoint')       return 'CPEndpoint';
      if(tier==='User Essentials'||tier==='User Pro') return 'CPUser';
      if(tier==='365 Backup')     return 'CP365Backup';
      if(tier==='Webroot')        return 'EndpointSec';   // standalone AV, not a bundle
      const k=splitCPOther(cls,item);
      if(k==='CP_SOC')   return 'SOC';
      if(k==='STD_SOC')  return 'SOC';
      if(k==='STD_AV')   return 'EndpointSec';
      if(k==='PENTEST')  return 'PenTest';
      if(k==='EMAILSEC') return 'EmailSec';
      if(k==='SERVICES') return 'ProjectServices';
      return 'CPEndpoint';
    }
    if(fam==='Endpoint Security')           return 'EndpointSec';
    if(fam==='Email Security')              return 'EmailSec';
    if(fam==='Cyber Awareness Training')    return 'Awareness';
    if(fam==='Firewall / Network Security') return 'Firewall';
    if(fam==='Backup / DR')                 return 'Backup';
    if(fam==='VoIP')                        return 'VOIP';
    if(fam==='Connectivity')                return 'Connectivity';
    if(fam==='Web / Domain')                return 'WebDomain';
    if(fam==='Hardware')                    return 'Hardware';
    if(fam==='Professional Services')       return 'ProjectServices';
    // "Other" family: rescue a few known products
    const t=(cls+' '+item).toLowerCase();
    if(/huntress/.test(t))  return 'SOC';
    if(/hexnode/.test(t))   return 'MDM';
    if(/pen ?test|ptaas/.test(t)) return 'PenTest';
    return 'Other';
  }

  /* ---------- capability model ---------- */
  function deriveCaps(rows){
    const caps=new Set();
    let ep='None', usr='None', avStd=false, socStd=false;
    for(const r of rows){
      const fam=r.fam, tier=r.tier||'', t=((r.cls||'')+' '+(r.item||'')).toLowerCase();
      if(fam==='CyberProtect / Kaseya 365'){
        if(tier==='Endpoint'){ if(ep!=='Pro') ep='Basic'; }
        else if(tier==='User Pro') usr='Pro';
        else if(tier==='User Essentials'){ if(usr!=='Pro') usr='Essential'; }
        else if(tier==='365 Backup') caps.add('M365Backup');
        else if(tier==='Webroot') avStd=true;
        else {
          const k=splitCPOther(r.cls,r.item);
          if(k==='CP_SOC')  ep='Pro';
          if(k==='STD_SOC') socStd=true;
          if(k==='STD_AV')  avStd=true;
          if(k==='PENTEST') caps.add('PenTest');
          if(k==='EMAILSEC')caps.add('EmailSecurity');
        }
      }
      if(fam==='Endpoint Security') avStd=true;
      if(fam==='Email Security')    caps.add('EmailSecurity');
      if(fam==='Cyber Awareness Training') caps.add('Awareness');
      if(fam==='Firewall / Network Security') caps.add('Firewall');
      if(fam==='Backup / DR')       caps.add('BackupBCDR');
      if(fam==='VoIP')              caps.add('VOIP');
      if(fam==='Managed IT'){ caps.add('RMM'); caps.add('PatchMgmt'); }
      if(r.cat==='Yes')  caps.add('Awareness');
      if(r.voip==='Yes') caps.add('VOIP');
      if(/huntress/.test(t)) socStd=true;
      if(/hexnode/.test(t))  caps.add('MDM');
      if(/pen ?test|ptaas/.test(t)) caps.add('PenTest');
      if(/graphus|vade|inky/.test(t)) caps.add('EmailSecurity');
      // Microsoft identity / security SKUs
      if(tier==='Business Premium'||/entra|\bp2\b azure|\be5\b|\be3\b|defender/.test(t)) caps.add('TenantSecurity');
    }
    if(avStd)  caps.add('EndpointProtection');
    if(socStd) caps.add('SOC');
    if(ep!=='None'){ ['EndpointProtection','Ransomware','RMM','PatchMgmt','DNSFilter','ThirdPartyPatch'].forEach(c=>caps.add(c)); }
    if(ep==='Pro') caps.add('SOC');
    if(usr!=='None'){ ['EmailSecurity','M365Backup','CDR','TenantSecurity'].forEach(c=>caps.add(c)); }
    if(usr==='Pro'){ ['Awareness','PhishingSim','DarkWeb'].forEach(c=>caps.add(c)); }
    return {caps:[...caps].sort(), cp:{endpoint:ep,user:usr,avStd,socStd}};
  }

  /* ---------- Microsoft 365 product naming ---------- */
  const TIER_RANK={'E5':7,'Business Premium':6,'E3':5,'Business Standard':4,'Business Basic':3,'M365 Apps':2,'Exchange':1};
  const CORE_M365=['Business Basic','Business Standard','Business Premium','E3','E5','M365 Apps','Exchange'];
  function m365Prod(item, tier){
    if(tier && tier!=='' && tier!=='Azure') return tier;
    const i=(item||'').toLowerCase();
    if(i.includes('platinum'))        return 'Business Premium';
    if(/copilot|co-pilot/.test(i))    return 'Copilot';
    if(/bus(iness)? prem/.test(i))    return 'Business Premium';
    if(/business standard|bus std/.test(i)) return 'Business Standard';
    if(/bus basic|business basic/.test(i))  return 'Business Basic';
    if(/\be5\b/.test(i))              return 'E5';
    if(/\be3\b/.test(i))              return 'E3';
    if(/apps for bus|apps for ent|pro plus/.test(i)) return 'M365 Apps';
    if(/\bep1\b|\bep2\b|exchange/.test(i)) return 'Exchange';
    if(/entra|azure ad/.test(i))      return 'Entra ID';
    if(/defender|atp/.test(i))        return 'Defender';
    if(/phone system|calling plan|teams/.test(i)) return 'Teams Voice';
    if(/project|\bpp3\b/.test(i))     return 'Project';
    if(/visio/.test(i))               return 'Visio';
    if(/power bi/.test(i))            return 'Power BI Pro';
    if(/intune/.test(i))              return 'Intune';
    if(/audio conf/.test(i))          return 'Audio Conferencing';
    if(/dynamics/.test(i))            return 'Dynamics 365';
    if(/storage|dataverse|onedrive|sharepoint/.test(i)) return 'Storage/Capacity';
    if(/nce \d+%|management fee|rebate/.test(i)) return 'Rebate/Fee';
    return 'Other M365';
  }

  /* ---------- name matching for optional attribute file ---------- */

  /* ---------- client name matching ----------
     Three outcomes, never two. A site is auto-matched only when the evidence is unambiguous,
     put to a review queue when a candidate is plausible but unproven, and only treated as
     pending migration when nothing in the revenue data resembles it at all. A company that
     appears anywhere in Revenue_Fact can therefore never be reported as pending. */
  const STOP=new Set(['ltd','limited','llc','plc','clg','dac','the','company','co','group','inc','and','of','ta',
    'national','school','ns','college','centre','center','services','service','solutions','solution',
    'ireland','irish','dublin','holdings','trading','partners','associates','consulting','consultants',
    'management','systems','technologies','technology','enterprises','international','global','projects',
    'project','care','home','medical','health','clinic','st','saint','boys','girls','junior','senior',
    'primary','secondary','community','family','resource','support']);
  function toks(s){
    return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/\u2019/g,"'")
      .replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(t=>t.length>1&&!STOP.has(t));
  }
  const squash=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  function buildIndex(names){
    const dfc={}, tk={}, sq={};
    names.forEach(n=>{ const t=toks(n); tk[n]=t; sq[n]=squash(n); new Set(t).forEach(x=>dfc[x]=(dfc[x]||0)+1); });
    return {dfc,tk,sq,names};
  }
  function matchSite(site, ix){
    const qs=squash(site);
    // names written without spaces, for example Belongto against BeLonG To Youth Services
    if(qs.length>=7){
      const hits=ix.names.filter(n=>ix.sq[n].length>=7&&(ix.sq[n].includes(qs)||qs.includes(ix.sq[n])));
      if(hits.length===1) return {name:hits[0],score:1,why:'name written without spaces'};
      if(hits.length>1)  return {name:hits[0],score:0.7,why:hits.length+' possible matches'};
    }
    const q=toks(site);
    if(!q.length) return {name:null,score:0,why:'nothing to match on'};
    const anchor=q[0];
    let best=null,bs=0,why='';
    for(const n of ix.names){
      const k=ix.tk[n]; if(!k.length) continue;
      const ks=new Set(k), common=q.filter(t=>ks.has(t));
      if(!common.length) continue;
      const rare=common.filter(t=>ix.dfc[t]<=2);
      const cover=common.length/Math.min(q.length,k.length);
      const exact=cover>=0.999&&rare.length>0&&ks.has(anchor);
      const sc=exact?1:Math.min(0.9,cover);
      if(sc>bs){ bs=sc; best=n; why=exact?('matched on '+rare.slice(0,2).join(' and ')):'partial name overlap'; }
    }
    return {name:best,score:Math.round(bs*100)/100,why};
  }

  function normName(s){
    s=(s||'').toLowerCase().replace(/&/g,' and ').replace(/\./g,' ');
    s=s.replace(/[^a-z0-9 ]/g,' ');
    s=s.replace(/\b(ltd|limited|llc|plc|clg|dac|the|company|co|group|inc)\b/g,' ');
    return s.replace(/\s+/g,' ').trim();
  }
  function bigrams(s){const b=new Set();for(let i=0;i<s.length-1;i++)b.add(s.slice(i,i+2));return b;}
  function dice(a,b){if(!a.length||!b.length)return 0;const A=bigrams(a),B=bigrams(b);let n=0;A.forEach(x=>{if(B.has(x))n++;});return 2*n/(A.size+B.size);}
  function matchName(raw, lookup, overrides){
    const n=normName(raw);
    if(overrides && overrides[raw]) return overrides[raw];
    if(lookup[n]) return lookup[n];
    for(const [k,v] of Object.entries(lookup)){
      if(n.length>=6 && (k.includes(n)||n.includes(k)) && Math.min(n.length,k.length)/Math.max(n.length,k.length)>0.55) return v;
    }
    let best=null,sc=0;
    for(const [k,v] of Object.entries(lookup)){const d=dice(n,k);if(d>sc){sc=d;best=v;}}
    return sc>=0.88?best:null;
  }

  const INTERNAL=/^itdotie$|^it\.ie$/i;

  // Sites that were renamed. The device export uses the new name, NetSuite still bills the old one.
  // Sites the device export names differently from NetSuite. Keyed on the normalised site name.
  const SITE_ALIAS={
    'nspca':'DSPCA',                                             // renamed from DSPCA
    'ism':'Irish School of Motoring Ltd',
    '2 into 3':'2into3',
    'fransiscans':'The Franciscan Province of Ireland',           // spelt differently in the device export
    'oreillys auctions':'O\u2019Reilly\u2019s Auction Rooms 1948 Ltd',
    'st josephs girls national school':"St. Joseph's GNS",
    'nqa':'North Quay Associates Ltd',
    'jdes':'Jade Dowling Electrical Services Ltd',
    'jmifa':'John Millett Argyle Financial Services'
  };
  // Pairs that look similar but are unrelated organisations and must never be matched to each other.
  const NEVER=[[/^emeis\b/i,/caremark/i],[/^bmg\b/i,/./i]];
  function blocked(site,candidate){
    for(const [a,b] of NEVER){ if(a.test(site)&&b.test(candidate)) return true; }
    return false;
  }

  /* ================= main ================= */
  function process(fact, master, devMap, gapFlags, opts){
    opts=opts||{};
    const nameOverrides=opts.nameOverrides||{};

    /* --- 1. clean fact table --- */
    const rows=[], rebRows=[];
    for(const r of fact){
      if(!r.date) continue;                                   // drops the grand-total row
      const acc=r.account||'';
      // Vendor rebates are real income but nobody is paying them as a client, so they are held
      // separately and kept out of MRR, client lists, posture and every sales view.
      if(/rebate/i.test(acc)){ rebRows.push({m:r.date.slice(0,7),v:+r.amount||0,who:r.master||'Unknown'}); continue; }
      const rc = acc.startsWith('Sales Recurring') ? 0 : acc.startsWith('Sales Non Recurring') ? 1 : -1;
      if(rc<0) continue;                                      // excludes management, COGS, inventory, purchases
      if(!r.master || INTERNAL.test(r.master)) continue;
      r.rc=rc; r.month=r.date.slice(0,7);
      r.svc=svcOf(r);
      r.div=(r.cadence==='Annual')?12:1;
      rows.push(r);
    }

    const months=[...new Set(rows.map(r=>r.month))].sort();
    const NM=months.length, mI={}; months.forEach((m,i)=>mI[m]=i);
    const comps=[...new Set(rows.map(r=>r.master))].sort();
    const NC=comps.length, cI={}; comps.forEach((c,i)=>cI[c]=i);
    const svcs=SVC_ORDER.filter(s=>rows.some(r=>r.svc===s));
    const sI={}; svcs.forEach((s,i)=>sI[s]=i);

    const maxDate=rows.reduce((a,r)=>r.date>a?r.date:a,'');
    const lastPartial=+maxDate.slice(8,10)<25;
    const lastFull=(lastPartial&&NM>1)?months[NM-2]:months[NM-1];
    const lfIdx=months.indexOf(lastFull);
    const WIN=new Set(months.slice(Math.max(0,lfIdx-5),lfIdx+1));   // last 6 complete months
    const L12=new Set(months.slice(Math.max(0,lfIdx-11),lfIdx+1));

    /* --- 2. aggregates --- */
    const agg=new Map(), daily=new Map(), m365agg=new Map();
    const recEq=Array.from({length:NC},()=>new Float64Array(NM));
    const recEqSvc=new Map();
    const brRec=new Map();          // branch -> Float64Array (monthly-eq recurring)
    const rowsByC={}, ttmR={}, ttmN={}, firstBy={}, lastBy={};

    for(const r of rows){
      const ci=cI[r.master], mi=mI[r.month];
      const k=ci+'|'+mi+'|'+sI[r.svc]+'|'+r.rc;
      const e=agg.get(k)||[0,0]; e[0]+=r.amount; e[1]+=r.qty||0; agg.set(k,e);
      const de=daily.get(r.date)||[0,0]; de[r.rc]+=r.amount; daily.set(r.date,de);

      if(r.rc===0){
        const sk=ci+'|'+r.svc; let arr=recEqSvc.get(sk); if(!arr){arr=new Float64Array(NM);recEqSvc.set(sk,arr);}
        let br=brRec.get(r.branch); if(!br){br=new Float64Array(NM);brRec.set(r.branch,br);}
        if(r.div===1){ recEq[ci][mi]+=r.amount; arr[mi]+=r.amount; br[mi]+=r.amount; }
        else { const q=r.amount/12; for(let k2=mi;k2<Math.min(NM,mi+12);k2++){ recEq[ci][k2]+=q; arr[k2]+=q; br[k2]+=q; } }
        if(r.amount>0){
          if(!firstBy[r.master]||r.month<firstBy[r.master]) firstBy[r.master]=r.month;
          if(!lastBy[r.master] ||r.month>lastBy[r.master])  lastBy[r.master]=r.month;
        }
        if(r.svc==='M365'||r.svc==='Azure'){
          const prod=m365Prod(r.item,r.tier);
          const mk=ci+'|'+mi+'|'+prod; const me=m365agg.get(mk)||[0,0];
          me[0]+=r.amount; me[1]+=r.qty||0; m365agg.set(mk,me);
        }
      }
      if(L12.has(r.month)){ if(r.rc===0) ttmR[r.master]=(ttmR[r.master]||0)+r.amount; else ttmN[r.master]=(ttmN[r.master]||0)+r.amount; }
      if(WIN.has(r.month)&&r.amount>0) (rowsByC[r.master]=rowsByC[r.master]||[]).push(r);
    }

    const factRows=[...agg].map(([k,v])=>{const p=k.split('|').map(Number);return [p[0],p[1],p[2],p[3],Math.round(v[0]*100)/100,Math.round(v[1]*10)/10];});
    const dailyRows=[...daily].sort((a,b)=>a[0]<b[0]?-1:1).map(([d,v])=>[d,Math.round(v[0]*100)/100,Math.round(v[1]*100)/100]);
    const prods=[...new Set([...m365agg.keys()].map(k=>k.split('|')[2]))].sort();
    const pI={}; prods.forEach((p,i)=>pI[p]=i);

    /* --- 3. M365 estate per company --- */
    const m365By={};
    for(const [k,v] of m365agg){
      const [ci,mi,prod]=k.split('|'); const mon=months[+mi];
      if(!L12.has(mon)) continue;
      const c=comps[+ci];
      const e=(m365By[c]=m365By[c]||{});
      const slot=e[prod]=e[prod]||{maxQ:0,last:'',rev:0};
      if(v[1]>slot.maxQ) slot.maxQ=v[1];
      if(mon>slot.last) slot.last=mon;
      slot.rev+=v[0];
    }

    /* --- 4. devices, branches, owners --- */
    const compLookup={}; comps.forEach(c=>{const n=normName(c); if(!compLookup[n])compLookup[n]=c;});
    const branchesByC={}, allBranches=new Set();
    for(const r of rows){ (branchesByC[r.master]=branchesByC[r.master]||new Set()).add(r.branch); allBranches.add(r.branch); }
    const branchLookup={}; allBranches.forEach(b=>{const n=normName(b); if(!branchLookup[n])branchLookup[n]=b;});

    const ix=buildIndex(comps), bix=buildIndex([...allBranches]);
    const devByComp={}, devByBranch={}, unmatched=[], review=[];
    for(const d of (devMap||[])){
      const site=d.site, cnt=+d.count||0;
      if(INTERNAL.test(site)) continue;
      let comp=null, how='';
      const alias=SITE_ALIAS[normName(site)];
      if(alias && cI[alias]!==undefined){ comp=alias; how='known name change'; }
      if(!comp && nameOverrides[site] && cI[nameOverrides[site]]!==undefined){ comp=nameOverrides[site]; how='assigned by you'; }
      if(!comp && d.master && cI[d.master]!==undefined && !blocked(site,d.master)){ comp=d.master; how='mapped in the workbook'; }
      let m=null;
      if(!comp){
        m=matchSite(site, ix);
        if(m.name && !blocked(site,m.name)){
          if(m.score>=0.999){ comp=m.name; how=m.why; }
        } else if(m.name && blocked(site,m.name)) m=null;
      }
      if(comp){
        devByComp[comp]=(devByComp[comp]||0)+cnt;
        let br=(d.branch && allBranches.has(d.branch)) ? d.branch : null;
        if(!br){ const bm=matchSite(site,bix); if(bm.name&&bm.score>=0.999&&!blocked(site,bm.name)) br=bm.name; }
        if(br) devByBranch[br]=(devByBranch[br]||0)+cnt;
      } else if(m && m.name && m.score>=0.5){
        review.push({site,dev:cnt,suggest:m.name,score:m.score,why:m.why});
      } else {
        unmatched.push([site,cnt]);
      }
    }
    unmatched.sort((a,b)=>b[1]-a[1]);
    review.sort((a,b)=>b.dev-a.dev);

    /* Clients whose billing still sits in the other ERP: devices under management, no revenue here yet. */
    const pendingMap={};
    for(const [site,cnt] of unmatched){
      const g=site.includes(' - ') ? site.split(' - ')[0].trim() : site.trim();
      const e=pendingMap[g]=pendingMap[g]||{g,dev:0,sites:[]};
      e.dev+=cnt; e.sites.push([site,cnt]);
    }
    const pending=Object.values(pendingMap).sort((a,b)=>b.dev-a.dev);

    const ownerByComp={};
    for(const m of (master||[])){ if(m.company&&m.owner) ownerByComp[m.company]=m.owner; }
    const flagsByComp={};
    for(const g of (gapFlags||[])){ if(g.company) flagsByComp[g.company]=g; }

    /* --- 5. optional attribute file (Win10 / Secure Score / cert / industry) --- */
    const attrByComp={};
    for(const a of (opts.attrs||[])){
      const hit=matchName(a.customer, compLookup, nameOverrides);
      if(hit && !attrByComp[hit]) attrByComp[hit]=a;
    }

    /* --- 6. company meta --- */
    const recentCut=months[Math.max(0,lfIdx-5)];
    const meta=comps.map(c=>{
      const ci=cI[c];
      const mrr={};
      for(const [sk,arr] of recEqSvc){ const i=sk.indexOf('|'); if(+sk.slice(0,i)!==ci) continue; const v=arr[lfIdx]; if(v>0.5) mrr[sk.slice(i+1)]=Math.round(v*100)/100; }
      const {caps,cp}=deriveCaps(rowsByC[c]||[]);
      const mp=m365By[c]||{};
      let seats=0, tiers=[];
      for(const [p,v] of Object.entries(mp)){
        if(CORE_M365.includes(p)&&v.last>=recentCut) seats+=v.maxQ;
        if(TIER_RANK[p]&&v.last>=recentCut&&v.maxQ>0) tiers.push(p);
      }
      const tier=tiers.length?tiers.reduce((a,b)=>TIER_RANK[a]>=TIER_RANK[b]?a:b):'';
      const brs=[...(branchesByC[c]||[])].sort();
      const a=attrByComp[c]||{};
      const f=flagsByComp[c]||{};
      return {
        n:c, br:brs.length>1?brs:[], dev:devByComp[c]||0,
        seats:Math.round(seats), tier,
        mrr, ttmR:Math.round((ttmR[c]||0)*100)/100, ttmN:Math.round((ttmN[c]||0)*100)/100,
        first:firstBy[c]||'', last:lastBy[c]||'',
        caps, cp,
        m365:Object.fromEntries(Object.entries(mp).filter(([,v])=>v.last>=recentCut).map(([p,v])=>[p,{s:Math.round(v.maxQ),l:v.last}])),
        owner:ownerByComp[c]||'',
        ...(a.win10!==undefined?{win10:a.win10}:{}),
        ...(a.score!==undefined&&a.score!==''?{score:a.score}:{}),
        ...(a.cert?{cert:a.cert}:{}),
        ...(a.industry?{industry:a.industry}:{}),
      };
    });

    /* --- 7. branch table --- */
    const branches=[];
    for(const [master,set] of Object.entries(branchesByC)){
      if(set.size<=1) continue;
      for(const b of set){
        const arr=brRec.get(b);
        branches.push({n:b, m:master, mrr:arr?Math.round(arr[lfIdx]*100)/100:0, dev:devByBranch[b]||0});
      }
    }
    branches.sort((a,b)=>b.mrr-a.mrr);

    /* --- 8. flat recurring matrix --- */
    const recEqFlat=[];
    for(let c=0;c<NC;c++) for(let m=0;m<NM;m++) if(recEq[c][m]>0.5) recEqFlat.push([c,m,Math.round(recEq[c][m]*100)/100]);

    const rebByMonth={}, rebByWho={};
    rebRows.forEach(r=>{ rebByMonth[r.m]=(rebByMonth[r.m]||0)+r.v; rebByWho[r.who]=(rebByWho[r.who]||0)+r.v; });
    const rebate={ byMonth:months.map(m=>Math.round((rebByMonth[m]||0)*100)/100),
      byWho:Object.entries(rebByWho).map(([k,v])=>[k,Math.round(v*100)/100]).sort((a,b)=>b[1]-a[1]),
      total:Math.round(rebRows.reduce((a,r)=>a+r.v,0)*100)/100,
      current:Math.round((rebByMonth[lastFull]||0)*100)/100 };

    return {
      generated:new Date().toISOString().slice(0,10), source:'workbook', rebate,
      maxDate, lastFull, months, clients:comps, svcs, prods,
      rows:factRows, daily:dailyRows, meta, branches,
      recEq:recEqFlat, rmmUnmatched:unmatched, pending, review,
      hasAttrs:(opts.attrs||[]).length>0
    };
  }

  return {process, svcOf, deriveCaps, normName, matchName, isRemoteMIT, splitCPOther, SVC_ORDER, buildIndex, matchSite, blocked};
})();
if(typeof module!=='undefined') module.exports=PIPE;
</script>

let DATA=null;
/* Data feed: when deployed via Azure Static Web Apps this points at the
   protected API route that serves the latest NetSuite sync (see README).
   Leave as-is to keep the dashboard fully manual/local, exactly as it
   ships today — nothing changes unless that route actually exists. */
/* Data sources: a small registry rather than one hardcoded feed. Each
   source is {id, label, url, role}. role:'primary' feeds the dashboard's
   own revenue/client model (must return the four Revenue_Fact-shaped
   sheets, same as the workbook). role:'secondary' is any other system
   (a CRM, a helpdesk, etc.) — its data is fetched and stored as-is under
   SOURCE_DATA[id] for future pages to use, without touching the existing
   revenue pipeline. Add as many secondary sources as you like; nothing
   about the primary NetSuite feed changes when you do.
   See README for how each source's API route is wired up in Azure. */
const SOURCES_DEFAULT=[
  {id:'netsuite',label:'NetSuite — revenue & clients',url:'/api/getSource/netsuite',role:'primary'},
  {id:'crm',label:'CRM — pipeline & opportunities',url:'/api/getSource/crm',role:'secondary'}
];
function getSources(){
  try{ const raw=localStorage.getItem('itie3_sources'); if(raw){const s=JSON.parse(raw); if(Array.isArray(s)&&s.length)return s;} }catch(e){}
  return SOURCES_DEFAULT.map(x=>({...x}));
}
function saveSources(list){ try{localStorage.setItem('itie3_sources',JSON.stringify(list));}catch(e){} }
function primarySource(){ return getSources().find(s=>s.role==='primary')||getSources()[0]; }
let SOURCE_DATA=(function(){ try{return JSON.parse(localStorage.getItem('itie3_source_data')||'{}');}catch(e){return {};} })();
function saveSourceData(){ try{localStorage.setItem('itie3_source_data',JSON.stringify(SOURCE_DATA));}catch(e){} }
function addSource(){
  const label=prompt('Name for this data source (e.g. "CRM — opportunities")');
  if(!label)return;
  const id=(label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||('source-'+Date.now()));
  const list=getSources();
  if(list.some(s=>s.id===id)){alert('A source with a similar name already exists.');return;}
  list.push({id,label,url:'/api/getSource/'+id,role:'secondary'});
  saveSources(list);
  renderData();
}
function removeSourceRow(id){
  if(!confirm('Remove this data source? This only removes the connection, not any data already built into the dashboard.'))return;
  saveSources(getSources().filter(s=>s.id!==id));
  delete SOURCE_DATA[id]; saveSourceData();
  renderData();
}
function updateSource(id,field,val){
  const list=getSources();
  const s=list.find(x=>x.id===id); if(!s)return;
  if(field==='role'&&val==='primary'){ list.forEach(x=>{ if(x.id!==id) x.role='secondary'; }); }
  s[field]=val;
  saveSources(list);
}

const CAP_W_TOT=Object.values(CAP_W).reduce((a,b)=>a+b,0);
const NIS2=[
 {id:'a',t:'Risk analysis & information security policies',caps:[],org:true},
 {id:'b',t:'Incident handling',caps:['SOC','EndpointProtection','EmailSecurity']},
 {id:'c',t:'Business continuity, backup & disaster recovery',caps:['M365Backup','BackupBCDR']},
 {id:'d',t:'Supply chain security',caps:[],org:true},
 {id:'e',t:'Security in systems acquisition, development & maintenance',caps:['PatchMgmt','ThirdPartyPatch','PenTest']},
 {id:'f',t:'Policies to assess effectiveness of measures',caps:['PenTest'],score:true},

 {id:'h',t:'Cryptography & encryption',caps:[],org:true},

];
function postureScore(m){let s=0;(m.caps||[]).forEach(c=>{if(CAP_W[c])s+=CAP_W[c];});return s/CAP_W_TOT;}
function nis2Status(m){
  const caps=new Set(m.caps||[]);
  return NIS2.map(a=>{
    if(a.org)return {...a,state:'pol'};
    let have=a.caps.filter(c=>caps.has(c)).length;
    if(a.score&&m.score!==undefined&&m.score!=='')have++;
    const need=a.caps.length+(a.score?1:0);
    return {...a,state:have===0?'gap':have>=need?'met':'part',have,need};
  });
}
function nis2Pct(m){const s=nis2Status(m).filter(a=>!a.org);let v=0;s.forEach(a=>{if(a.state==='met')v++;else if(a.state==='part')v+=.5;});return v/s.length;}

/* ============ binding ============ */
let M,C,S,P,META,NM,NC,NC0,cI,metaByC,recEqM,lastFullIdx,hasAttrs,hasData,BRANCH,brByMaster;
function bindData(){
  hasData=!!(DATA&&DATA.rows&&DATA.rows.length);
  if(!hasData){document.getElementById('gen').textContent='No data — open Data Hub';return;}
  applyRenames();
  M=DATA.months;C=DATA.clients.slice();S=DATA.svcs;P=DATA.prods;META=DATA.meta.slice();NM=M.length;NC=C.length;NC0=NC;
  cI={};C.forEach((c,i)=>cI[c]=i); metaByC={};META.forEach(m=>metaByC[m.n]=m);
  META.forEach(m=>{ m.ownerFinal=m.owner||''; if(m.crm)delete m.crm; if(m.migrating)delete m.migrating; });
  lastFullIdx=DATA.lastFull?M.indexOf(DATA.lastFull):NM-1; if(lastFullIdx<0)lastFullIdx=NM-1;
  recEqM=Array.from({length:NC},()=>new Float64Array(NM));
  for(const [c,m,v] of DATA.recEq) recEqM[c][m]=v;
  BRANCH=DATA.branches||[]; brByMaster={};
  BRANCH.forEach(b=>(brByMaster[b.m]=brByMaster[b.m]||[]).push(b));
  hasAttrs=!!DATA.hasAttrs||META.some(m=>m.win10!==undefined||m.score!==undefined);
  state.m0=Math.max(0,lastFullIdx-11);state.m1=lastFullIdx;
  mergeCRM();
  document.getElementById('gen').textContent='Loaded · to '+(DATA.maxDate||M[NM-1]);
  renderSourceBadge();
}
const state={sel:null,owner:'',m0:0,m1:0,cmp:'none',page:'exec',c360:null};
/* Clients that have changed trading name since the ERP data was cut. Renaming here keeps one
   consistent identity across every page and export, and is skipped if the new name already exists. */
function applyRenames(){
  const existing=new Set(DATA.clients);
  for(const [from,to] of Object.entries(CLIENT_RENAME)){
    if(from===to||!existing.has(from)||existing.has(to)) continue;
    const i=DATA.clients.indexOf(from);
    DATA.clients[i]=to; existing.delete(from); existing.add(to);
    const m=DATA.meta.find(x=>x.n===from); if(m)m.n=to;
    (DATA.branches||[]).forEach(b=>{if(b.m===from)b.m=to;});
  }
}

function ownerOf(n){if(OWNER_OVR[n])return OWNER_OVR[n];const m=metaByC[n];return (m&&(m.ownerFinal||m.owner))||'Unassigned';}
function filteredClients(){let x=[...Array(NC).keys()];if(state.owner)x=x.filter(i=>ownerOf(C[i])===state.owner);if(state.sel&&state.sel.size)x=x.filter(i=>state.sel.has(i));return x;}
function idxSetOrNull(){const f=filteredClients();return f.length===NC?null:new Set(f);}
function filteredMeta(){return filteredClients().map(i=>metaByC[C[i]]).filter(Boolean);}

const fmtE=v=>'€'+Math.round(v).toLocaleString('en-IE');
const fmtEk=v=>Math.abs(v)>=1e6?'€'+(v/1e6).toFixed(2)+'M':Math.abs(v)>=1000?'€'+(v/1000).toFixed(1)+'K':'€'+Math.round(v);
const fmtP=v=>(v*100).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq=s=>esc(s).replace(/'/g,"\\'");
function monthLabel(m){const[y,mo]=m.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+' '+y.slice(2);}
const charts={};
function mkChart(id,cfg){if(charts[id])charts[id].destroy();const el=document.getElementById(id);if(!el)return;charts[id]=new Chart(el,cfg);}
if(window.Chart){Chart.defaults.color='#8ea0c0';Chart.defaults.borderColor='rgba(255,255,255,.07)';Chart.defaults.font.family='Roboto,Arial,sans-serif';}
const PALETTE=['#00a0d8','#f9c20d','#2fbf71','#8e6cf0','#e5484d','#39c6c0','#f28c3b','#c6d84d','#e06ec4','#6b8afd','#9aa5b1','#57d0fa'];
const SVC_LABEL={MIT:'Managed IT',RMIT:'Remote Managed IT',M365:'Microsoft 365',Azure:'Azure',
 CPEndpoint:'CyberProtect Endpoint',CPUser:'CyberProtect User',CP365Backup:'CyberProtect 365 Backup',
 SOC:'SOC / MDR',EndpointSec:'Endpoint Security (AV)',EmailSec:'Email Security',Awareness:'Awareness Training',
 PenTest:'Pen Testing',Firewall:'Firewall',Backup:'Backup & DR',MDM:'MDM',VOIP:'VoIP',
 Connectivity:'Connectivity',WebDomain:'Web & Domains',Hardware:'Hardware',ProjectServices:'Professional Services',Other:'Other'};

function totMRR(m){return Object.values(m.mrr).reduce((a,b)=>a+b,0);}
function isActive(m){return totMRR(m)>50;}
function isManaged(m){return (m.mrr.MIT||0)>0||(m.mrr.RMIT||0)>0;}
function has(m,c){return (m.caps||[]).includes(c);}
function hasM365(m){return (m.mrr.M365||0)>0&&m.seats>0;}
function hasCopilot(m){return !!(m.m365&&m.m365['Copilot']);}
const PREM=t=>t==='Business Premium'||t==='E3'||t==='E5';
function supportMRR(m){return (m.mrr.MIT||0)+(m.mrr.RMIT||0);}
function supportType(m){return (m.mrr.MIT||0)>=(m.mrr.RMIT||0)&&(m.mrr.MIT||0)>0?'MIT':(m.mrr.RMIT||0)>0?'RMIT':'';}
function supportTarget(m){return supportType(m)==='RMIT'?RATES.rmitDev:RATES.mitDev;}

/* ============ opportunity engine ============ */
function customOpps(m){
  return CUSTOM_SVC.map(s=>{
    const basis=s.unit==='device'?(m.dev||m.seats||0):s.unit==='user'?(m.seats||m.dev||0):1;
    const v=(+s.price||0)*basis;
    return {t:'custom',v,nis2:[],txt:`<b>${esc(s.name)}</b>, propose at €${s.price} per ${s.unit} giving about ${fmtE(v)}/mo`};
  }).filter(o=>o.v>10);
}
function pbRate(name,fallback){ const x=pbFind(name); if(!x)return fallback; const v=pbMonthly(x,false); return v>0?v:fallback; }
function clientOpps(m){
  const o=[], dev=m.dev||0, seats=m.seats||0, cp=m.cp||{endpoint:'None',user:'None'};
  const st=supportType(m), sup=supportMRR(m);
  if(dev>0&&st){
    const tgt=supportTarget(m), gap=dev*tgt-sup;
    if(gap>25) o.push({t:'pricing',v:gap,nis2:[],txt:`<b>${st==='RMIT'?'Remote Managed IT':'Managed IT'} under target</b>, ${dev} devices at €${(sup/dev).toFixed(2)} against €${tgt}, worth +${fmtE(gap)}/mo`});
    if(st==='RMIT') o.push({t:'upgrade',v:0,nis2:['i'],txt:`<b>Remote to full Managed IT</b>, full support on ${dev} devices would be about ${fmtE(dev*RATES.mitDev)}/mo`});
  }
  if(isActive(m)){
    if(cp.endpoint==='None'&&dev>0){
      o.push({t:'cyber',v:dev*RATES.cpEndBasic,nis2:['b','e','i'],
        txt:`<b>CyberProtect Endpoint</b>, ${cp.avStd?'consolidate standalone antivirus into the managed bundle':'no managed endpoint in place'} across ${dev} devices, about ${fmtE(dev*RATES.cpEndBasic)}/mo`});
    } else if(cp.endpoint==='Basic'&&dev>0){
      const v=dev*(RATES.cpEndPro-RATES.cpEndBasic);
      if(v>0) o.push({t:'cyber',v,nis2:['b'],txt:`<b>Endpoint to Endpoint Pro</b>, adds 24×7 SOC across ${dev} devices, +${fmtE(v)}/mo`});
    }
    if(cp.user==='None'&&hasM365(m)){
      o.push({t:'cyber',v:seats*RATES.cpUserEss,nis2:['b','c','j'],
        txt:`<b>CyberProtect User Essentials</b>, email security, 365 backup, cloud detection and tenant security for ${seats} users, about ${fmtE(seats*RATES.cpUserEss)}/mo`});
    } else if(cp.user==='Essential'&&seats>0){
      const v=seats*(RATES.cpUserPro-RATES.cpUserEss);
      if(v>0) o.push({t:'cyber',v,nis2:['g'],txt:`<b>User Essentials to User Pro</b>, adds awareness training, phishing simulation and dark web monitoring for ${seats} users, +${fmtE(v)}/mo`});
    }
    if(!has(m,'Awareness')&&seats>2) o.push({t:'cyber',v:seats*RATES.awarenessSeat,nis2:['g'],txt:`<b>Cyber Awareness Training</b>, ${seats} users untrained, about ${fmtE(seats*RATES.awarenessSeat)}/mo`});
    if(!has(m,'BackupBCDR')&&isManaged(m)) o.push({t:'cyber',v:RATES.bcdrFlat,nis2:['c'],txt:`<b>Server backup and BCDR</b>, no infrastructure backup on file, about ${fmtE(RATES.bcdrFlat)}/mo`});
    if(!has(m,'Firewall')&&isManaged(m)) o.push({t:'cyber',v:RATES.firewallFlat,nis2:['b','i'],txt:`<b>Firewall as a service</b>, none under management, about ${fmtE(RATES.firewallFlat)}/mo`});
    if(!has(m,'MDM')&&dev>=10) o.push({t:'cyber',v:dev*RATES.mdmDev,nis2:['i'],txt:`<b>Mobile Device Management</b> across ${dev} devices, about ${fmtE(dev*RATES.mdmDev)}/mo`});
    if(!has(m,'PenTest')&&(dev>=25||totMRR(m)>1500)) o.push({t:'cyber',v:RATES.penFlat,nis2:['e','f'],txt:`<b>Penetration testing</b>, supports the NIS2 effectiveness requirement, about ${fmtE(RATES.penFlat)}/mo`});
  }
  if(hasM365(m)){
    if(!PREM(m.tier)&&m.tier&&seats>2){const v=seats*RATES.premiumUpliftSeat;
      o.push({t:'m365',v,nis2:['i','j'],txt:`<b>Uplift to Business Premium</b>, ${seats} seats on ${esc(m.tier)}, +${fmtE(v)}/mo and unlocks Defender, Intune and enforced MFA`});}
    if(!hasCopilot(m)&&seats>4){const v=seats*RATES.copilotSeat*(RATES.copilotAttach/100);
      o.push({t:'m365',v,nis2:[],txt:`<b>Copilot whitespace</b>, none of ${seats} seats licensed, about ${fmtE(v)}/mo at ${RATES.copilotAttach}% attach`});}
  }
  if(m.win10>0) o.push({t:'hardware',v:0,nis2:['e'],txt:`<b>Windows 10 exposure</b>, ${m.win10} devices past end of support, refresh worth about ${fmtE(m.win10*RATES.win10Refresh)} one-off`});
  o.push(...customOpps(m));
  o.sort((a,b)=>b.v-a.v);
  return o;
}
function oppTotal(m){return clientOpps(m).reduce((a,b)=>a+b.v,0);}

/* ============ period aggregation ============ */
function aggMonthlySvc(idxSet){
  const bySvcR={},totR=new Float64Array(NM),totN=new Float64Array(NM);
  for(const [c,m,s,rc,a] of DATA.rows){ if(idxSet&&!idxSet.has(c))continue;
    if(rc===0){(bySvcR[s]=bySvcR[s]||new Float64Array(NM))[m]+=a;totR[m]+=a;} else totN[m]+=a; }
  return {bySvcR,totR,totN};
}
function periodRevenue(m0,m1,idxSet){const{totR,totN}=aggMonthlySvc(idxSet);let r=0,n=0;for(let m=m0;m<=m1;m++){r+=totR[m];n+=totN[m];}return{r,n,t:r+n};}
function comparePeriod(){
  if(state.cmp==='none')return null;
  const len=state.m1-state.m0+1;
  if(state.cmp==='prev'){const b=state.m0-len;return b<0?null:{m0:b,m1:state.m0-1};}
  if(state.cmp==='yoy'){const a=state.m0-12;return a<0?null:{m0:a,m1:state.m1-12};}
  return null;
}
function deltaChip(cur,prev){if(prev==null||!isFinite(prev)||prev===0)return'';const d=(cur-prev)/Math.abs(prev),up=d>=0;return `<span class="cmp ${up?'pos':'neg'}">${up?'▲':'▼'} ${fmtP(Math.abs(d))}</span>`;}
function periodLabel(){return state.m0===state.m1?monthLabel(M[state.m0]):monthLabel(M[state.m0])+' to '+monthLabel(M[state.m1]);}
function radarCard(x){
  const nis=[...new Set(x.o.flatMap(o=>o.nis2||[]))].sort();
  const br=(metaByC[x.m.n].br||[]).length;
  return `<div class="radar-item"><h4><span class="clink" onclick="goClient('${jsq(x.m.n)}')">${esc(x.m.n)}${br?`<span class="srcbadge">${br} branches</span>`:''}</span><span class="eur">+${fmtE(x.v)}/mo</span></h4>
  <div class="hint" style="margin:2px 0 0">MRR ${fmtE(totMRR(x.m))} · ${x.m.dev||'no'} devices · ${x.m.seats||0} M365 seats · ${esc(ownerOf(x.m.n))}${nis.length?' · closes NIS2 '+nis.join(', ').toUpperCase():''}</div>
  <div class="acts">${x.o.slice(0,5).map(o=>`<div>${o.txt}</div>`).join('')}</div></div>`;
}

const SECT={0:'',1:'Analysis',5:'Sales tools',2:'Drill-down',3:'Cyber posture',6:'CRM',4:'Coming across'};
function buildNav(){
  document.getElementById('nav').innerHTML=PAGES.map(p=>{const[id,label,path,sect,sub]=p;

function applyPreset(r){
  const lf=lastFullIdx,y=+M[lf].slice(0,4);

  else if(r==='lastm'){state.m0=state.m1=Math.max(0,lf-1);}
  else if(r==='lastq'){state.m0=Math.max(0,lf-2);state.m1=lf;}
  else if(r==='ytd'){const i=M.indexOf(y+'-01');state.m0=i>=0?i:0;state.m1=lf;}

}

function renderKpi(){

  <div class="two">

    <div class="panel"><h3>Monthly client churn rate</h3><div class="chartbox"><canvas id="chChurn"></canvas></div></div>
  </div>
  <div class="panel"><h3>Biggest movers, ${monthLabel(M[t1])}</h3><div class="hint">Change in monthly-equivalent MRR against the prior month</div>

  ${f.map(q=>({n:C[q],now:recEqM[q][t1],d:recEqM[q][t1]-recEqM[q][t1-1]})).filter(x=>Math.abs(x.d)>25).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,30)

/* peers are clients of a similar size, which turns an upsell into a visible gap */
function peerGroup(m){
  const base=m.seats||m.dev||0;
  if(!base) return [];
  const lo=base*0.5, hi=base*2;
  return META.filter(x=>x.n!==m.n&&isActive(x)&&((x.seats||x.dev||0)>=lo)&&((x.seats||x.dev||0)<=hi));
}
function median(a){ if(!a.length)return 0; const s=[...a].sort((x,y)=>x-y); const i=Math.floor(s.length/2);
  return s.length%2?s[i]:(s[i-1]+s[i])/2; }
function peerPanel(m){
  const P=peerGroup(m);
  if(P.length<5) return '';
  const mm=median(P.map(totMRR)), ml=median(P.map(x=>Object.keys(x.mrr).length)), mp=median(P.map(postureScore));
  const mine=totMRR(m), lines=Object.keys(m.mrr).length, post=postureScore(m);
  const pct=v=>{const b=P.filter(x=>totMRR(x)<v).length;return Math.round(b/P.length*100);};
  const row=(label,mineV,peerV,fmt,good)=>{
    const d=peerV?((mineV-peerV)/peerV):0;
    const ok=good?d>=0:d<=0;
    return `<tr><td>${label}</td><td class="num">${fmt(mineV)}</td><td class="num" style="color:var(--mut)">${fmt(peerV)}</td>
    <td class="num ${ok?'pos':'warn'}">${peerV?(d>=0?'+':'')+fmtP(d):'—'}</td></tr>`;};
  return `<div class="panel"><h3>How they compare to similar clients</h3>
  <div class="hint">Measured against ${P.length} clients of roughly the same size, between half and double this one's user count. Median rather than average, so one very large client cannot distort it.</div>
  <table><thead><tr><th>Measure</th><th class="num">This client</th><th class="num">Typical peer</th><th class="num">Difference</th></tr></thead><tbody>
  ${row('Monthly recurring',mine,mm,fmtE,true)}

}

  mkChart('chW10',{type:'bar',data:{labels:t20.map(m=>m.n.length>28?m.n.slice(0,27)+'…':m.n),datasets:[{data:t20.map(m=>m.win10),backgroundColor:'#e5484d',borderRadius:3}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' devices, '+fmtE(c.parsed.x*RATES.win10Refresh)}}}}});
}

<script>
/* ============ file loading ============ */
const FILES={workbook:null,attrs:null};
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||(r.length===1&&r[0]!==''));
}
function readAs(file,mode){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;
  mode==='buf'?r.readAsArrayBuffer(file):r.readAsText(file,'UTF-8');});}
function d2s(v){
  if(v instanceof Date){const d=new Date(v.getTime()-v.getTimezoneOffset()*6e4);return d.toISOString().slice(0,10);}
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
  const s=String(v||'');
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}
/* ---- NetSuite raw feed -> workbook-shaped sheets, via the bundled mapping ----
   The bundle (service mapping, client grouping, device counts) is embedded in a
   JSON script tag, so the dashboard classifies the raw NetSuite feed itself and
   the workbook is no longer required. */
let _MAPIX=null;
function _leafOf(a){ const p=String(a||'').split(' : '); return p[p.length-1].trim(); }
function mapIndex(){
  if(_MAPIX) return _MAPIX;
  let B; try{ B=JSON.parse(document.getElementById('itieMapBundle').textContent); }catch(e){ B={entries:[],client:{},dev:[]}; }
  const key={},ai={},ic={},item={};
  for(const e of (B.entries||[])){
    const a=e[0],i=e[1],c=e[2]; const v={acct:a,fam:e[3]||'',tier:e[4]||'',cad:e[5]||'',cat:e[6]||'No',voip:e[7]||'No'};
    const lf=_leafOf(a);
    key[a+'|'+i+'|'+c]=v;            // full account path key
    if(!(lf+'|'+i+'|'+c in key)) key[lf+'|'+i+'|'+c]=v;   // leaf key (NetSuite sends the leaf)
    const kai=a+'|'+i; if(!(kai in ai)) ai[kai]=v;
    const kli=lf+'|'+i; if(!(kli in ai)) ai[kli]=v;
    const kic=i+'|'+c; if(!(kic in ic)) ic[kic]=v;
    if(!(i in item)) item[i]=v;
  }
  _MAPIX={key,ai,ic,item,client:B.client||{},dev:B.dev||[]};
  return _MAPIX;
}
function classifyLine(account,item,cls){
  const X=mapIndex();
  return X.key[account+'|'+item+'|'+cls] || X.ai[account+'|'+item] || X.ic[item+'|'+cls] || X.item[item] || {acct:account,fam:'',tier:'',cad:'',cat:'No',voip:'No'};
}
function netsuiteToSheets(feed,say){
  if(say)say('Classifying NetSuite invoices with your service mapping…');
  const X=mapIndex();
  const rows=feed.rows||[];
  const Revenue_Fact=rows.map(r=>{
    const account=(r.account||'').trim(), item=(r.item||'').trim(), cls=(r.class||'').trim();
    const m=classifyLine(account,item,cls);
    const cust=(r.customer||'').trim();
    const cm=X.client[cust]||null;
    const master=(cm&&cm[0])||cust, branch=(cm&&cm[1])||cust;
    return { Date:r.date, Master_Company:master, Branch_Name:branch,
      Account:(m.acct||account), Item:item, Class:cls,
      Amount:-(+r.amount||0), Quantity:-(+r.quantity||0),   // NetSuite books invoices negative; flip to positive revenue
      Service_Family:m.fam||'', Service_Tier:m.tier||'', Billing_Cadence:m.cad||'',
      Includes_CAT_CSAT:m.cat||'No', Includes_VoIP:m.voip||'No' };
  });
  const Device_Mapping=X.dev.map(d=>({ Device_Site:d[0], Device_Count:d[1], Mapped_Master_Company:d[2]||null, Mapped_Branch_Name:d[3]||null }));
  return { Revenue_Fact, Client_Master:[], Device_Mapping, Gap_Analysis_Flags:[] };
}

/* Row-mapping logic shared between the manual workbook upload and the
   automated data feed. Given the four "sheets" as plain arrays of row
   objects (same column names as the mapped build workbook), returns the
   shape buildDataset() expects. This is the single source of truth for
   how raw export columns become the dashboard's data model — a feed
   sync only ever needs to reproduce these four arrays, never this logic. */
function mapSheets(sheets,say){
  const J=n=>Array.isArray(sheets[n])?sheets[n]:[];
  if(say)say('Reading the revenue fact table…');
  const fact=J('Revenue_Fact').map(r=>({
    date:d2s(r.Date), master:r.Master_Company, branch:r.Branch_Name||r.Master_Company,
    account:r.Account||'', item:r.Item||'', cls:r.Class||'',
    amount:+r.Amount||0, qty:+r.Quantity||0,
    fam:r.Service_Family||'', tier:r.Service_Tier||'', cadence:r.Billing_Cadence||'',
    cat:r.Includes_CAT_CSAT, voip:r.Includes_VoIP }));
  if(say)say('Reading client, device and owner sheets…');
  const master=J('Client_Master').map(r=>({company:r.Master_Company,owner:r.Account_Manager,dev:+r.Company_Device_Count||0}));
  const devMap=J('Device_Mapping').map(r=>({site:r.Device_Site,count:+r.Device_Count||0,master:r.Mapped_Master_Company||null,branch:r.Mapped_Branch_Name||null}));
  const gap=J('Gap_Analysis_Flags').map(r=>({company:r.Master_Company,...r}));
  return {fact,master,devMap,gap};
}
async function loadWorkbook(file,say){
  say('Reading the workbook, this takes a moment on a file this size…');
  const wb=XLSX.read(new Uint8Array(await readAs(file,'buf')),{type:'array',cellDates:true});
  const need='Revenue_Fact';
  if(!wb.SheetNames.includes(need)) throw new Error('No "Revenue_Fact" sheet found. Expected the mapped build workbook.');
  const sheets={};
  ['Revenue_Fact','Client_Master','Device_Mapping','Gap_Analysis_Flags'].forEach(n=>{
    sheets[n]=wb.SheetNames.includes(n)?XLSX.utils.sheet_to_json(wb.Sheets[n],{raw:true}):[];
  });
  return mapSheets(sheets,say);
}
/* Pulls the same four sheets, as JSON, from a configured feed endpoint
   instead of a manually-dropped file. Expects:
   { "Revenue_Fact":[...], "Client_Master":[...], "Device_Mapping":[...], "Gap_Analysis_Flags":[...] }
   with the same column names as the workbook. See README for how the
   sync job (Power Automate) should produce this. */
let DIAG_NS=null;
async function loadFromFeed(url,say){
  say('Requesting the latest data feed…');
  const isNetSuite=/netsuite/i.test(url);
  if(isNetSuite){
    // pull year-by-year so no single window hits NetSuite's offset cap, then classify
    const base=url.split('?')[0];
    let all=[]; const nowY=new Date().getFullYear();
    for(let y=2023; y<=nowY; y++){
      const from=y+'-01-01', to=(y+1)+'-01-01';
      let page=0,hasMore=true,guard=0;
      while(hasMore && guard<150){
        say('Pulling NetSuite invoices '+y+' ('+all.length.toLocaleString()+' lines so far)…');
        const res=await fetch(base+'?from='+from+'&to='+to+'&page='+page,{credentials:'include',cache:'no-store'});
        if(!res.ok){ const t=await res.text().catch(()=> ''); throw new Error('NetSuite feed failed ('+res.status+'). '+t.slice(0,160)); }
        const j=await res.json();
        if(j&&j.rows){ all=all.concat(j.rows); hasMore=!!j.hasMore; } else { throw new Error('Unexpected NetSuite feed response.'); }
        page++; guard++;
      }
    }
    DIAG_NS={rows:all, pulledAt:new Date().toISOString()};
    return mapSheets(netsuiteToSheets({source:'netsuite',rows:all},say),say);
  }
  const res=await fetch(url,{credentials:'include',cache:'no-store'});
  if(!res.ok) throw new Error('Data feed request failed ('+res.status+'). Check the feed URL and that you are signed in.');
  const payload=await res.json();
  const sheets=(payload&&(payload.source==='netsuite'||Array.isArray(payload.rows)))?netsuiteToSheets(payload,say):payload;
  if(!Array.isArray(sheets.Revenue_Fact)) throw new Error('Data feed response is missing Revenue_Fact.');
  return mapSheets(sheets,say);
}
async function loadAttrs(file){
  const nm=file.name.toLowerCase();
  let rows;
  if(nm.endsWith('.csv')||nm.endsWith('.txt')) rows=parseCSV(await readAs(file,'text'));
  else { const wb=XLSX.read(new Uint8Array(await readAs(file,'buf')),{type:'array'}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}); }
  let hi=-1,hs=null;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const h=rows[i].map(x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,''));
    if(h.some(x=>x.includes('customer'))){hi=i;hs=h;break;}
  }
  if(hi<0) throw new Error('Could not find a "Customers" column in the attributes file.');
  const gi=n=>hs.findIndex(h=>h.includes(n));
  const c={cust:gi('customer'),win:gi('windows'),cert:gi('cert'),score:gi('secure'),ind:gi('industry')};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r[c.cust])continue;
    let sc=c.score>=0?String(r[c.score]||'').replace('%','').trim():'';
    sc=sc?(parseFloat(sc)>1?parseFloat(sc)/100:parseFloat(sc)):'';
    out.push({customer:String(r[c.cust]).trim(),
      win10:c.win>=0?parseInt(String(r[c.win]).replace(/[^0-9]/g,''))||0:0,
      cert:c.cert>=0?String(r[c.cert]||'').trim():'',
      score:(sc===''||isNaN(sc))?'':sc,
      industry:c.ind>=0?String(r[c.ind]||'').trim():''});
  }
  return out;
}
/* ============ DATA HUB ============ */

    <button class="btn" onclick="buildDataset()">Process and build the dashboard</button>

  <div style="max-height:420px;overflow:auto;margin-top:8px">
  ${DATA.review.map(r=>`<div class="maprow"><div>${esc(r.site)}<small style="display:block;color:var(--mut2);font-size:11px">closest: ${esc(r.suggest)} · ${esc(r.why)}</small></div><div style="color:var(--mut2)">→</div>
    <select data-site="${esc(r.site)}" class="nmap"><option value="">Leave unassigned</option>${C.map(c=>`<option value="${esc(c)}"${(NAME_OVR[r.site]||r.suggest)===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
    <div class="cnt">${r.dev} dev</div></div>`).join('')}

  <div class="panel"><h3>How the numbers are built</h3><div class="hint" style="margin-bottom:10px">So any figure here can be defended in a board meeting.</div>

  <p style="margin-top:9px"><b>MRR is annual-normalised.</b> Lines marked Annual are divided into a monthly equivalent and spread forward across the term, so a yearly licence does not spike in one month and read as nothing for the next eleven. MRR is measured at the last complete month, and a partial final month is excluded.</p>

  <p style="margin-top:9px"><b>Clients are master companies</b>, so multi-site groups roll into one relationship with branches shown underneath on the Client 360 page.</p>

  ['workbook','attrs'].forEach(k=>{

function prog(on,txt){document.getElementById('prog').classList.toggle('on',on);if(txt)document.getElementById('progTxt').textContent=txt;}
/* source: 'file' (default, uses FILES.workbook) or 'feed' (uses the

async function buildDataset(opts){
  opts=opts||{};
  const source=opts.source||'file';
  const silent=!!opts.silent;
  const msg=document.getElementById('buildMsg');

    // no workbook: build live from the primary NetSuite feed instead

    else { if(msg)msg.innerHTML='<div class="note" style="border-color:rgba(229,72,77,.4)"><b>Nothing to build from.</b> Load the NetSuite source above, or drop a workbook.</div>'; return false; }
  }
  if(source==='feed'&&!primarySource()){
    if(msg&&!silent)msg.innerHTML='<div class="note" style="border-color:rgba(229,72,77,.4)"><b>No primary data source configured.</b> Add one in Connected Sources below.</div>';
    return false;
  }
  if(!silent)prog(true,'Starting…');
  try{
    await new Promise(r=>setTimeout(r,60));
    const say=t=>{if(!silent)prog(true,t);};
    const {fact,master,devMap,gap}=source==='feed'
      ? await loadFromFeed(primarySource().url,say)
      : await loadWorkbook(FILES.workbook,say);
    let attrs=[];
    if(FILES.attrs){say('Reading client attributes…');attrs=await loadAttrs(FILES.attrs);}
    say('Classifying services and building the model…');
    await new Promise(r=>setTimeout(r,60));
    const out=PIPE.process(fact,master,devMap,gap,{attrs,nameOverrides:NAME_OVR});
    DATA=out;
    if(PERSIST){
      try{localStorage.setItem('itie3_data',JSON.stringify(out));}
      catch(e){if(msg&&!silent)msg.innerHTML='<div class="note"><b>Built, but too large to keep in this browser.</b> The dashboard works now and will need rebuilding next time.</div>';}
    } else { localStorage.removeItem('itie3_data'); }
    bindData();buildNav();buildFbar();applyPreset('ttm');syncMonthInputs();
    if(!silent)prog(false);
    const un=(out.rmmUnmatched||[]).length;
    if(msg&&!silent)msg.innerHTML=`<div class="note"><b>Dashboard built.</b> ${out.clients.length} master companies, ${out.months.length} months to ${out.maxDate}, ${fact.length.toLocaleString()} source rows. Last complete month ${out.lastFull}.${un?` ${un} device sites remain unassigned, listed below.`:''}${attrs.length?` Attributes matched for ${out.meta.filter(m=>m.win10!==undefined||m.score!==undefined).length} clients.`:''}</div>`;
    if(!silent)setTimeout(()=>go('exec'),500);
    return true;
  }catch(err){
    if(!silent)prog(false);
    if(msg&&!silent)msg.innerHTML=`<div class="note" style="border-color:rgba(229,72,77,.4)"><b>Could not process that file.</b> ${esc(err.message||err)}</div>`;

/* Loads any non-primary source (a CRM, a helpdesk, anything else) and
   stores the raw response under SOURCE_DATA[id]. This does not feed the
   revenue/client model — it's a landing spot so the data is on hand for
   whatever page gets built to use it next, without needing to touch the
   NetSuite pipeline to add a new integration. */
async function loadSecondarySource(id){
  const src=getSources().find(s=>s.id===id);
  const status=document.getElementById('srcstatus-'+id);
  if(!src){return false;}
  if(status)status.textContent='Loading…';
  try{
    const res=await fetch(src.url,{credentials:'include',cache:'no-store'});
    if(!res.ok) throw new Error('Request failed ('+res.status+')');
    const json=await res.json();
    SOURCE_DATA[id]={data:json,loadedAt:new Date().toISOString()};
    saveSourceData();
    // re-run the merge now so ownership fills immediately, whatever order things were loaded in
    crmAnalyse();
    if(hasData){ bindData(); buildNav(); rebuildOwnerFilter(); } else { buildNav(); }
    renderSourceBadge();
    const accs=(json&&Array.isArray(json.accounts))?json.accounts.length:(Array.isArray(json)?json.length:0);
    const linked=(json&&Array.isArray(json.accounts)&&typeof CRM!=='undefined'&&CRM)?CRM.matched:null;
    if(status)status.textContent='Loaded '+(accs?accs+' accounts'+(linked!=null?', '+linked+' linked to clients':''):'data')+' · '+new Date().toLocaleString('en-IE');
    if(!hasData&&hasCrm()&&state.page==='data'){ go('crm'); } else if(state.page==='data'){ renderData(); } else if(hasData||['crm','recon','pipeline','leads','assign'].includes(state.page)) refresh();
    return true;
  }catch(err){
    if(status)status.textContent='Not connected yet ('+(err.message||err)+')';
    return false;
  }
}

function mrrTrend(m){
  const c=cI[m.n]; if(c===undefined)return 0;
  const now=recEqM[c][lastFullIdx], then=recEqM[c][Math.max(0,lastFullIdx-6)];
  return then>0?(now-then)/then:0;
}
function riskScore(m){
  const r=[]; let pts=0;
  const tr=mrrTrend(m);
  if(tr<-0.15){pts+=3;r.push(`recurring down ${fmtP(Math.abs(tr))} over six months`);}
  else if(tr<-0.05){pts+=1;r.push('recurring drifting down');}
  const lines=Object.keys(m.mrr).length;
  if(lines<=1){pts+=2;r.push('single service line, nothing else holding the account');}
  if(postureScore(m)<0.3){pts+=2;r.push('critical security posture');}
  if(!isManaged(m)&&totMRR(m)>200){pts+=1;r.push('no managed support agreement');}
  if(m.ttmN<=0&&totMRR(m)>300){pts+=1;r.push('no project work in twelve months');}
  if(m.cp.endpoint==='None'&&m.dev>0){pts+=1;r.push('no managed endpoint protection');}
  return {pts,reasons:r,level:pts>=5?'High':pts>=3?'Medium':'Low'};
}
function anniversary(m){
  if(!m.first) return null;
  const mm=+m.first.slice(5,7);
  const curM=+M[lastFullIdx].slice(5,7);
  let inM=mm-curM; if(inM<0)inM+=12;
  const yrs=+M[lastFullIdx].slice(0,4)-(+m.first.slice(0,4));
  return {month:mm,inM,yrs};
}
const MONN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const now=recEqM[c][lastFullIdx], peak=Math.max(...Array.from({length:12},(_,i)=>recEqM[c][Math.max(0,lastFullIdx-11+i)]));
    return now<50&&peak>200;}).map(m=>{const c=cI[m.n];

const AM_ALIASES={'emil bidea':'Emil Badea','emil badea':'Emil Badea','derek ocallaghan':"Derek O'Callaghan"};
function canonAM(n){ if(!n)return ''; const k=String(n).toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim(); return AM_ALIASES[k]||n; }
function reconcileAM(ns,crm,ovr){ ns=canonAM(ns); crm=canonAM(crm);
  if(ovr) return {am:canonAM(ovr),source:'corrected',mismatch:false};
  if(ns&&crm&&ns!==crm) return {am:crm,source:'crm',mismatch:true,nsSays:ns};
  if(crm) return {am:crm,source:'crm',mismatch:false};
  if(ns) return {am:ns,source:'netsuite',mismatch:false};
  return {am:'Unassigned',source:'none',mismatch:false}; }
function crmStatusOf(active,hasRevenue){ if(active) return hasRevenue?'billing':'migrating'; return hasRevenue?'untagged':'prospect'; }

let CENTRAL_META={updatedAt:null,updatedBy:null,synced:false};
async function loadCentralOverrides(){
  try{
    const r=await fetch('/api/overrides',{credentials:'include',cache:'no-store'});
    if(!r.ok) return false;
    const d=await r.json(); if(!d||typeof d!=='object') return false;
    Object.assign(OWNER_OVR, d.ownerOverrides||{});
    Object.assign(CRM_XWALK, d.nameCrosswalk||{});
    Object.assign(CLIENT_RENAME, d.clientRenames||{});
    CENTRAL_META={updatedAt:d.updatedAt||null,updatedBy:d.updatedBy||null,synced:true};
    try{ localStorage.setItem('itie3_owner',JSON.stringify(OWNER_OVR));
         localStorage.setItem('itie3_crm_xwalk',JSON.stringify(CRM_XWALK));
         localStorage.setItem('itie3_rename',JSON.stringify(CLIENT_RENAME)); }catch(e){}
    return true;
  }catch(e){ return false; }
}
async function pushOverride(patch){
  try{
    const r=await fetch('/api/overrides',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    if(r.ok){ const d=await r.json(); CENTRAL_META={updatedAt:d.updatedAt,updatedBy:d.updatedBy,synced:true}; return {ok:true}; }
    if(r.status===403) return {ok:false,reason:'not-admin'};
    return {ok:false,reason:'error'};
  }catch(e){ return {ok:false,reason:'offline'}; }
}

function crmFeed(){ for(const k of Object.keys(SOURCE_DATA)){ const d=SOURCE_DATA[k]&&SOURCE_DATA[k].data; if(d&&Array.isArray(d.accounts)) return d; } return null; }

function blankMeta(nm,acc,dev){
  return { n:nm, br:[], dev:dev||0, seats:0, tier:'', mrr:{}, ttmR:0, ttmN:0, first:'', last:'',
    caps:[], cp:{endpoint:'None',user:'None',avStd:false,socStd:false}, m365:{}, owner:'',
    ownerFinal:(accCls(acc).am||canonAM(acc.am))||'Unassigned', migrating:true,

/* Join the CRM feed to the NetSuite client model.
   - a tag names the manager; NetSuite wins on conflict, CRM fills blanks
   - tagged active accounts with no NetSuite match become migrating clients (acquired co.)
   - confident name matches auto-link; plausible ones go to the reconciliation queue */
function mergeCRM(){
  crmAnalyse();
  CRM=null;
  const feed=crmFeed(); if(!feed||!hasData) return;
  const baseNames=C.slice(0,NC0);
  const ix=PIPE.buildIndex(baseNames);
  const review=[], mismatches=[], migrating=[], untagged=[];
  const attach={};
  const pend=(DATA.pending||[]);
  const pendIx=pend.length?PIPE.buildIndex(pend.map(x=>x.g)):null;
  const pendUsed={};
  for(const acc of (feed.accounts||[])){
    const nm=(acc.name||'').trim(); if(!nm) continue;
    let client=CRM_XWALK[nm]||null; if(client==='__migrating__'){ if(acc.active)migrating.push(acc); continue; }
    if(client&&cI[client]===undefined) client=null;
    if(!client){
      const m=PIPE.matchSite(nm, ix);
      if(m.name && !PIPE.blocked(nm,m.name)){
        if(m.score>=0.999) client=m.name;
        else if(m.score>=0.5 && acc.active){ review.push({crmName:nm,suggest:m.name,score:m.score,crmAm:acc.am,tags:acc.tags||[]}); continue; }
      }
    }
    const cl=accCls(acc);
    const ownerAm=amFromOwnerId(acc.owner_id)||amFromOwner(acc.owner_name);
    if(client){ attach[client]={tags:acc.tags||[],active:true,dormant:cl.dormant,crmAm:(ownerAm||cl.am||''),crmId:acc.crmId,crmName:nm,ownerRaw:acc.owner_name||''}; }
    else if(cl.active){ migrating.push(acc); }
  }
  // apply to base NetSuite clients
  for(let i=0;i<NC0;i++){
    const m=META[i]; const a=attach[m.n];
    const crmAm=a?a.crmAm:'', active=a?a.active:false, dormant=a?a.dormant:false;
    const rec=reconcileAM(m.owner||'', crmAm, OWNER_OVR[m.n]);
    m.ownerFinal=rec.am;
    m.crm={ tags:a?a.tags:[], active, dormant, crmAm, crmId:a?a.crmId:null,
            status:crmStatusOf(active,true), mismatch:rec.mismatch, nsSays:rec.nsSays||'', crmName:a?a.crmName:'' };
    if(rec.mismatch) mismatches.push({client:m.n, netsuite:rec.nsSays||canonAM(m.owner||''), crm:canonAM(crmAm)});
    if(!a && totMRR(m)>50) untagged.push(m.n);
  }
  // add migrating clients (tagged, acquired, no NetSuite revenue yet)
  for(const acc of migrating){
    const nm=(acc.name||'').trim();
    if(!nm||cI[nm]!==undefined) continue;
    let dev=0;
    if(pendIx){ const pm=PIPE.matchSite(nm,pendIx); if(pm.name&&pm.score>=0.6&&!pendUsed[pm.name]){ const pg=pend.find(x=>x.g===pm.name); if(pg){ dev=pg.dev; pendUsed[pm.name]=1; } } }
    const m=blankMeta(nm,acc,dev);
    META.push(m); C.push(nm); cI[nm]=C.length-1; metaByC[nm]=m;
  }
  NC=C.length;
  while(recEqM.length<NC) recEqM.push(new Float64Array(NM));
  CRM={ accounts:(feed.accounts||[]).length, activeAccounts:(feed.accounts||[]).filter(a=>accCls(a).active).length,
        matched:Object.keys(attach).length, review, mismatches,
        migrating:migrating.map(a=>({name:a.name,am:accCls(a).am,tags:a.tags||[]})), untagged,
        loadedAt:(function(){for(const k of Object.keys(SOURCE_DATA)){const d=SOURCE_DATA[k];if(d&&d.data&&Array.isArray(d.data.accounts))return d.loadedAt;}return '';})() };
}

/* save a name decision from the reconciliation screen, then re-merge live */
function crmAssign(crmName, clientName){
  const val = clientName==='__migrating__' ? '__migrating__' : (clientName||null);
  if(val) CRM_XWALK[crmName]=val; else delete CRM_XWALK[crmName];
  saveXwalk(); bindData(); rebuildOwnerFilter();
  pushOverride({nameCrosswalk:{[crmName]: val}}).then(()=>{ if(state.page==='recon')renderRecon(); });
  if(state.page==='recon')renderRecon(); else refresh();
}
function crmSetOwner(client, owner){
  if(owner) OWNER_OVR[client]=owner; else delete OWNER_OVR[client];
  try{localStorage.setItem('itie3_owner',JSON.stringify(OWNER_OVR));}catch(e){}
  bindData(); rebuildOwnerFilter();
  pushOverride({ownerOverrides:{[client]: owner||null}}).then(()=>{ if(state.page==='recon')renderRecon(); });
  if(state.page==='recon')renderRecon(); else refresh();
}
