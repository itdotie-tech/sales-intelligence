/* CRM analysis that stands on its own, so the Nimble data is useful even
   before NetSuite is connected. Reads the feed directly, no client model needed. */
let CRMA=null;
function crmAnalyse(){
  const feed=crmFeed(); if(!feed){ CRMA=null; return; }
  const accs=feed.accounts||[];
  const active=[],dormant=[],prospects=[];
  const byManager={}, tagCounts={}, accountTagCounts={};
  accs.forEach(a=>{ a._cls=null; const cls=accCls(a);
    (a.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; if(isAccountTag(t)) accountTagCounts[t]=(accountTagCounts[t]||0)+1; });
    if(cls.active){ active.push(a); const m=cls.am||'Unassigned'; byManager[m]=(byManager[m]||0)+1; }
    else if(cls.dormant) dormant.push(a); else prospects.push(a);
  });
  let loadedAt=''; for(const k of Object.keys(SOURCE_DATA)){ const d=SOURCE_DATA[k]; if(d&&d.data&&Array.isArray(d.data.accounts)){ loadedAt=d.loadedAt; break; } }
  CRMA={ total:accs.length, active:active.length, dormant:dormant.length, prospects:prospects.length, byManager, tagCounts, accountTagCounts, activeAccounts:active, loadedAt };
}
function isAccountTag(t){ return /accounts?/i.test(t) && /(^|[^a-z])(DF|DG|DMcD|DOC|EB|EJ|SC|MD)([^a-z]|$)/i.test(t); }
/* Read the account tags directly, so who-owns-whom is decided here, not upstream.
   Tolerant of "(D)" dormancy anywhere and of the code sitting anywhere in the tag. */
function classifyTags(tags){
  let active=false,dormant=false,amCode=null,am='';
  const codes=Object.keys(AM_ROSTER).sort((a,b)=>b.length-a.length);
  for(const raw of (tags||[])){
    if(!/accounts?/i.test(raw)) continue;
    const d=/\(\s*d\s*\)/i.test(raw);
    for(const c of codes){
      const re=new RegExp('(^|[^a-z])'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i');
      if(re.test(raw)){ if(d){ dormant=true; } else { active=true; if(!amCode){ amCode=c; am=AM_ROSTER[c]; } } break; }
    }
  }
  return {active,dormant,amCode,am};
}
function accCls(a){ return a._cls || (a._cls=classifyTags(a.tags)); }
const OWNER_ID_MAP={
  '6615cb2a14140ee9e7db2099':'Michael Daly',
  '66e9eb62a138cecfe5899efd':'Simon Collins',
  '6819db274273b7d185dd9729':'Emil Badea',
  '5e21c591f92ea14034649568':'Eamon Gallagher',
  '5c4cd46f94c7bcfa7230ec97':'David Flood',
  '685a5f53bd065a4d2592da53':'Eoghan Johnson',
  '685a5f5474e3cdb2ebb830bd':'David McDonald',
  '685a5f53f13f7d31571235b9':"Derek O'Callaghan",
  '5c2dd140508044fcb755850c':'David Groark'
};
function amFromOwnerId(id){ return (id!=null&&OWNER_ID_MAP[String(id)])||''; }
function amFromOwner(ownerName){
  if(!ownerName) return '';
  const canon=canonAM(ownerName); const vals=Object.values(AM_ROSTER);
  if(vals.includes(canon)) return canon;
  const o=String(ownerName).toLowerCase().trim();
  for(const v of vals){ const parts=v.toLowerCase().split(' '); const last=parts[parts.length-1], first=parts[0];
    if(o===v.toLowerCase()) return v;
    if(o.includes(last)&&o.includes(first)) return v;   // "Simon Collins", "collins, simon", "simon.collins@..."
  }
  return '';
}

function allDeals(){ const feed=crmFeed(); if(!feed) return []; const out=[];
  (feed.accounts||[]).forEach(a=>(a.pipeline||[]).forEach(d=>out.push({...d, account:a.name, am:accCls(a).am||'Unassigned'})));
  return out; }
function hasPipeline(){ return allDeals().length>0; }
function dealAge(d){ if(d.ageDays!=null) return d.ageDays; return null; }

  const wVal=deals.reduce((s,d)=>s+(+d.value||0)*((d.probability!=null?+d.probability:50)/100),0);

function leadScore(a){
  // transparent, tunable. Uses what the feed provides; deal value and recency
  // dominate once the deals/activity feed is in, tags carry it until then.
  let s=0; const why=[];
  const dv=(a.pipeline||[]).reduce((x,d)=>x+(+d.value||0),0);
  if(dv>0){ const p=Math.min(40,Math.round(dv/250)); s+=p; why.push('deal value +'+p); }
  if(a.lastContactDays!=null){ const r=a.lastContactDays<=30?20:a.lastContactDays<=90?10:0; if(r){s+=r;why.push('recent contact +'+r);} }
  const svc=(a.tags||[]).filter(t=>!isAccountTag(t)).length;
  if(svc){ const p=Math.min(20,svc*5); s+=p; why.push('interest signals +'+p); }
  if((a.tags||[]).length){ s+=5; why.push('engaged +5'); }
  return {score:s, why};
}
function renderLeads(){
  if(!hasCrm()){ document.getElementById('pg-leads').innerHTML=lockCrmMsg('leads'); return; }
  crmAnalyse();
  const feed=crmFeed(); const prospects=(feed.accounts||[]).filter(a=>{const c=accCls(a);return !c.active&&!c.dormant;});
  const scored=prospects.map(a=>({a, ...leadScore(a)})).sort((x,y)=>y.score-x.score);
  const enriched=scored.filter(x=>x.score>5).length;
  document.getElementById('pg-leads').innerHTML=`
  <h1 class="ph">Lead <em>Scoring</em></h1>

/* ---- Churn prediction: transparent, factor-based, from NetSuite + CRM signals ---- */
function avgArr(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function churnFactors(m){
  const f=[]; let score=0; const ci=cI[m.n];
  if(ci!=null && recEqM[ci]){ const arr=Array.from(recEqM[ci]); const n=lastFullIdx;
    const recent=avgArr(arr.slice(Math.max(0,n-2),n+1)), prior=avgArr(arr.slice(Math.max(0,n-5),Math.max(0,n-2)));
    if(prior>0){ const chg=(recent-prior)/prior;
      if(chg<-0.1){ const pts=Math.min(35,Math.round(-chg*70)); score+=pts; f.push(['Revenue falling',pts,Math.round(chg*100)+'% vs prior quarter']); } } }
  const p=postureScore(m);
  if(p<0.35){ score+=20; f.push(['Weak security posture',20,Math.round(p*100)+'% of the stack']); }
  else if(p<0.55){ score+=10; f.push(['Below-par posture',10,Math.round(p*100)+'%']); }
  const vals=Object.values(m.mrr||{}).map(v=>+v||0), tot=totMRR(m), top=vals.length?Math.max(...vals):0;
  if(tot>0 && vals.length>1 && top/tot>0.85){ score+=15; f.push(['Reliant on one service',15,Math.round(top/tot*100)+'% from a single line']); }
  else if(tot>0 && vals.filter(v=>v>0).length===1){ score+=15; f.push(['Single service only',15,'no spread to defend']); }
  if((m.ttmN||0)===0 && tot>0){ score+=8; f.push(['No recent projects',8,'no one-off work in 12 months']); }
  const a=crmAccountFor(m.n);
  if(a && a.lastContactDays!=null){ if(a.lastContactDays>120){ score+=20; f.push(['No recent contact',20,a.lastContactDays+' days since last touch']); }
    else if(a.lastContactDays>60){ score+=10; f.push(['Contact slipping',10,a.lastContactDays+' days']); } }
  score=Math.min(100,score);
  return { score, level: score>=50?'High':score>=25?'Medium':'Low', factors:f };
}

  <p class="psub">A risk read on the active base, built from signals that tend to precede a client leaving. Every score is explained by the factors that drove it, so it is a prompt for a conversation, not a verdict. ${crmLive?'CRM contact recency is feeding in alongside the revenue signals.':'Revenue and posture signals are live; CRM contact recency joins automatically once the activity feed is connected.'}</p>
  <div class="grid cards">
    <div class="card ${high.length?'hl':''}"><div class="k">High risk</div><div class="v ${high.length?'neg':''}">${high.length}</div><div class="s">clients to act on now</div></div>
    <div class="card"><div class="k">Medium risk</div><div class="v warn">${med.length}</div><div class="s">worth watching</div></div>

    <div class="card"><div class="k">Base assessed</div><div class="v">${scored.length}</div><div class="s">active clients</div></div>
  </div>
  <div class="two">
    <div class="panel"><h3>Where the risk sits</h3><div class="chartbox"><canvas id="chChurn"></canvas></div></div>
    <div class="panel"><h3>How the prediction is decided</h3><div class="hint">A points model, deliberately simple so it can be reasoned about and tuned. Points add up to a score out of 100: Low under 25, Medium 25 to 49, High 50 and over.</div>
    <div class="twrap" style="max-height:300px"><table><thead><tr><th>Signal</th><th class="num">Up to</th><th>Why it matters</th></tr></thead><tbody>
      <tr><td>Revenue falling</td><td class="num">35</td><td>recurring down on the prior quarter</td></tr>

    </tbody></table></div></div>
  </div>

  <div class="twrap" style="max-height:460px"><table><thead><tr><th>Client</th><th>Owner</th><th class="num">MRR</th><th class="num">Risk</th><th>Reasons</th></tr></thead><tbody>
  ${scored.filter(x=>x.level!=='Low').slice(0,50).map(x=>`<tr><td class="clink" onclick="goClient('${jsq(x.m.n)}')">${esc(x.m.n)}</td><td>${esc(ownerOf(x.m.n))}</td><td class="num">${fmtE(totMRR(x.m))}</td><td class="num"><span class="${x.level==='High'?'neg':'warn'}"><b>${x.score}</b></span></td><td class="hint" style="margin:0">${x.factors.map(fc=>esc(fc[0])+' ('+fc[2]+')').join('; ')||'—'}</td></tr>`).join('')||'<tr><td colspan=5 class="hint">Nothing above low risk. The base looks stable on these signals.</td></tr>'}
  </tbody></table></div></div>`;
  const buckets=[high.length,med.length,scored.length-high.length-med.length];
  mkChart('chChurn',{type:'doughnut',data:{labels:['High','Medium','Low'],datasets:[{data:buckets,backgroundColor:['#e5484d','#f9c20d','#2fbf71']}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}
